spring.application.name=iis-backend

# Database
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Switch: "public" = Supabase REST API, "custom" = local JPA/Hibernate (default)
api.mode=custom
server.port=8080

spring.grpc.server.port=9090

# GraphQL
spring.graphql.graphiql.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=120000

# Supabase REST API (used when api.mode=public)
supabase.url=https://xuklmqzmfgwuwwvlkvpm.supabase.co
supabase.anon-key=${SUPABASE_ANON_KEY}
